services:
  # ── Frontend (React) ────────────────────────────────────────────
  - type: web
    name: smartedge-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true

  # ── Backend (FastAPI) ───────────────────────────────────────────
  - type: web
    name: smartedge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_API_SECRET
        sync: false
      - key: BYBIT_TESTNET
        value: "true"
      - key: ACCOUNT_MODE
        value: DEMO
    healthCheckPath: /health
    autoDeploy: true
