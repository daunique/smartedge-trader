# SmartEdge API — Fly.io
# Deploy from backend/:  fly deploy
# App name can be changed on first launch.

app = "smartedge-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  ACCOUNT_MODE = "DEMO"
  BYBIT_TESTNET = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
