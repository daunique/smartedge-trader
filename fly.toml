# Unified API + UI — deploy to smartedge-web (your existing app name)
# IMPORTANT: rebuild from source. Do NOT use --image registry.fly.io/...

app = "smartedge-web"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  ACCOUNT_MODE = "DEMO"
  BYBIT_TESTNET = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "8s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
