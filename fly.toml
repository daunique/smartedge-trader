# Bybit blocks some regions (e.g. jnb) via CloudFront 403.
# Use a supported region: lhr, iad, fra, sin, ams, nrt, ...
app = "smartedge-web"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  ACCOUNT_MODE = "DEMO"
  BYBIT_TESTNET = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "8s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
