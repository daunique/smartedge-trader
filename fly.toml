# ONE app: API + Web (recommended)
# Create once:  fly apps create smartedge-trader
# Secrets:      BYBIT_API_KEY, BYBIT_API_SECRET, DATABASE_URL (optional)
# Deploy:       fly deploy -a smartedge-trader

app = "smartedge-trader"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  ACCOUNT_MODE = "DEMO"
  BYBIT_TESTNET = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
