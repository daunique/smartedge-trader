# fly.toml app configuration file generated for smartedge-web on 2026-08-17T23:14:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "smartedge-web"
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[env]
  ACCOUNT_MODE = "DEMO"
  BYBIT_TESTNET = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  checks = [{ grace_period = '40s', interval = '15s', method = 'GET', path = '/health', timeout = '8s' }]

  [[http_service.checks]]
    interval = "15s"
    timeout = "8s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
